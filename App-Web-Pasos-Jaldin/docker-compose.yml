services:
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://lacarta:${POSTGRES_PASSWORD}@db:5432/lacarta
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  django:
    build: ./django_app
    environment:
      - DB_NAME=lacarta
      - DB_USER=lacarta
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - django

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lacarta
      POSTGRES_USER: lacarta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lacarta"]
      interval: 5s
      retries: 10

volumes:
  datos_pg: